<html lang="ar" dir="rtl">
<head>

<title>معاين مشاهد JSON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#171a1f;--mut:#667085;--bd:#e3e6eb;--ac:#e8b13a;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.2rem;margin:0;font-weight:900}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;container-type:size;--a:#f5c04a;--b:#8a5a00;--tx:#fff6e0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}.seg{margin-inline-start:auto}
button,select,.file{font:inherit;font-weight:700;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button{white-space:nowrap}button.go{flex:1;background:var(--ac);border-color:var(--ac);color:#1a1405}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:42px;padding:0 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
button:focus-visible,textarea:focus-visible,select:focus-visible,.file:focus-within,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 16px}
.card[open]{padding-bottom:16px}
summary{cursor:pointer;font-weight:700;min-height:52px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';margin-inline-start:auto;color:var(--mut);font-size:1.3rem}
details[open]>summary::after{content:'\2212'}
textarea{width:100%;height:220px;direction:ltr;text-align:left;font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;resize:vertical}
#srt{height:100px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;font-weight:600;font-size:.9rem}
#msg{margin:0;padding:0 4px;list-style:none;font-size:.9rem;min-height:1.4em}
#msg li{color:var(--er)}#msg.ok li{color:var(--mut)}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0}
.stage.vert{aspect-ratio:9/16;width:min(100%,calc(62vh*9/16));margin-inline:auto}
.themebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:56px;padding:8px 16px;font-weight:700}.themebar label{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}.themebar select{flex:1;border:0;background:transparent;min-height:44px;padding:0}.themebar input{flex:1;min-width:0;accent-color:var(--ac)}
[hidden]{display:none!important}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style>
</head>

<textarea id="srt" spellcheck="false" aria-label="SRT" placeholder="الصق محتوى SRT هنا أو ارفع الملف"></textarea>
<label class="file"><span>📄 رفع ملف SRT</span><input type="file" id="srtf" accept=".srt,.txt,text/plain"></label></details>

<details class="card"><summary>القيم المسموحة</summary><p class="hint" id="hv"></p></details>
</main>

self.postMessage({t:'done',chunks:out.chunks&&out.chunks.length?out.chunks:[{text:out.text,timestamp:[0,pcm.length/16000]}]})
}catch(err){self.postMessage({t:'err',m:String(err&&err.message||err)})}}`;
const say=m=>{msg.className='ok';msg.innerHTML='<li>'+m+'</li>'};
const t2s=t=>{const ms=Math.round(t*1000),p=(n,l=2)=>String(n).padStart(l,'0');return p(Math.floor(ms/3600000))+':'+p(Math.floor(ms/60000)%60)+':'+p(Math.floor(ms/1000)%60)+','+p(ms%1000,3)};
const toSrt=ch=>ch.filter(c=>c.text&&c.text.trim()).map((c,i)=>{const s0=c.timestamp[0]||0,e0=c.timestamp[1]==null?s0+2:c.timestamp[1];return(i+1)+'\n'+t2s(s0)+' --> '+t2s(Math.max(e0,s0+.3))+'\n'+c.text.trim()}).join('\n\n')+'\n';
function transcribe(){return new Promise(async(res,rej)=>{try{
const oc=new OfflineAudioContext(1,Math.ceil(abuf.duration*16000),16000),s=oc.createBufferSource();s.buffer=abuf;s.connect(oc.destination);s.start();
const pcm=new Float32Array((await oc.startRendering()).getChannelData(0));
if(!WK)WK=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})),{type:'module'});
TRP={rej};WK.onmessage=e=>{const d=e.data;if(d.t==='p')say(d.m);else if(d.t==='done'){TRP=null;res(d.chunks)}else if(d.t==='err'){TRP=null;rej(new Error(d.m))}};
WK.onerror=e=>{TRP=null;try{WK.terminate()}catch(x){}WK=null;rej(new Error(e.message||'تعذّر تشغيل نموذج التفريغ'))};
say('جارٍ تجهيز الصوت…');WK.postMessage({pcm,model:$('wm').value},[pcm.buffer])}catch(e){rej(e)}})}
async function genSrt(){NOTE='';try{const ch=await transcribe();$('srt').value=toSrt(ch);srtAuto=true;return true}catch(e){if(e.message==='cancel')return false;NOTE='<li style="color:var(--er)">تعذّر التفريغ التلقائي ('+String(e.message).replace(/</g,'')+'). ده بيشتغل بس لو الصفحة على استضافة ومعاك إنترنت أول مرة. ممكن تلصق SRT يدوي.</li>';return true}}
const hasCue=()=>{try{const j=JSON.parse(src.value);return(Array.isArray(j)?j:[j]).some(s=>s&&s.cue)}catch(e){return false}};
async function ensureSrt(){if(abuf&&!$('srt').value.trim()&&hasCue())return await genSrt();return true}
async function run(){if(!await ensureSrt())return;const tl=prep();if(tl)play(tl)}
$('srt').oninput=()=>{srtAuto=false};
$('tr').onclick=async()=>{if(!abuf){say('أضف ملف صوت الأول.');return}$('srt').value='';if(await genSrt())run()};
$('sv').onclick=()=>{const t=$('srt').value.trim();if(!t){say('مفيش SRT يتحفظ.');return}save(new Blob([t+'\n'],{type:'text/plain'}),audName+'-v'+(++SV)+'.srt')};
async function save(blob,name){let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
if(d){try{await d.save({filename:name,data:blob});msg.innerHTML='<li>تم حفظ '+name+'.</li>';return}catch(e){if(e&&e.code==='declined'){msg.innerHTML='<li>اتلغى الحفظ.</li>';return}}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg.innerHTML='<li>تم تجهيز '+name+' للتحميل.</li>'}
async function exportVideo(){if(REC)return;if(!window.MediaRecorder||!cv.captureStream){msg.className='';msg.innerHTML='<li>المتصفح ده مش بيدعم التسجيل. جرّب Chrome.</li>';return}
if(!await ensureSrt())return;const tl=prep();if(!tl)return;EXP=stage.classList.contains('vert')?{W:1080,H:1920}:{W:1920,H:1080};fit();
try{await document.fonts.load('900 40px Cairo')}catch(e){}
const st=cv.captureStream(30);let dest=null;if(abuf){dest=actx.createMediaStreamDestination();dest.stream.getAudioTracks().forEach(t=>st.addTrack(t))}
const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:8e6}:{}),ch=[];rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};REC=rec;
let wl=null;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
const fin=new Promise(r=>{rec.onstop=r});rec.start(1000);
const iv=setInterval(()=>{msg.className='ok';msg.innerHTML='<li>جارٍ التسجيل… '+Math.round(LT)+' / '+Math.round(tl.total)+' ثانية. سيب الشاشة شغالة.</li>'},500);
play(tl,()=>setTimeout(()=>{try{rec.stop()}catch(e){}},400),dest);
await fin;clearInterval(iv);if(wl)wl.release();EXP=null;fit();redraw();REC=null;if(rec.cancel)return;
const type=(rec.mimeType||mt||'video/webm').split(';')[0];await save(new Blob(ch,{type}),'scenes-v'+(++EV)+'.'+(type.includes('mp4')?'mp4':'webm'))}
$('play').onclick=run;$('thm').onchange=run;$('tint').oninput=e=>{TINT=e.target.value/100;redraw()};
function stopAll(){halt();if(TRP){TRP.rej(new Error('cancel'));TRP=null}if(WK){try{WK.terminate()}catch(e){}WK=null}if(REC){REC.cancel=1;try{REC.stop()}catch(e){}}TL=null;ctx.clearRect(0,0,cv.width,cv.height);msg.className='ok';msg.innerHTML='<li>تم الإيقاف.</li>'}
$('exp').onclick=exportVideo;
$('stop').onclick=stopAll;
const setOr=v=>{stage.classList.toggle('vert',v);$('orH').setAttribute('aria-pressed',String(!v));$('orV').setAttribute('aria-pressed',String(v));fit();redraw()};
$('orH').onclick=()=>setOr(false);$('orV').onclick=()=>setOr(true);
$('clr').onclick=()=>{halt();TL=null;src.value='';msg.className='ok';msg.innerHTML='<li style="color:var(--mut)">المربع فاضي — الصق JSON جديد.</li>'};
const onAud=async e=>{const f=e.target.files[0];if(!f)return;msg.className='ok';msg.innerHTML='<li>جارٍ قراءة الصوت…</li>';
try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();abuf=await actx.decodeAudioData(await f.arrayBuffer());audDur=abuf.duration;audName=f.name.replace(/\.[^.]+$/,'');if(srtAuto)$('srt').value='';$('aln').textContent='🎙 '+f.name.slice(0,18)+' · '+Math.round(audDur)+'ث';$('rma').hidden=false;run()}catch(x){abuf=null;audDur=0;msg.className='';msg.innerHTML='<li>تعذّر قراءة الصوت ('+String((x&&x.message)||x).replace(/</g,'')+') — جرّب mp3 أو wav.</li>'}};
$('aud').onchange=onAud;
$('srtf').onchange=async e=>{const f=e.target.files[0];if(f){srtAuto=false;$('srt').value=await f.text();run()}};
$('rma').onclick=()=>{token++;stopAud();abuf=null;audDur=0;if(srtAuto)$('srt').value='';$('aln').textContent='🎙 إضافة صوت';$('rma').hidden=true;$('aud').value='';run()};
const vi={};document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const k=b.dataset.ex,V=EXV[k];let o;if(V){vi[k]=((vi[k]??-1)+1)%V.length;o=V[vi[k]]}else o=EX[k];src.value=JSON.stringify(o,null,1);run()});
addEventListener('resize',()=>{fit();redraw()});if(document.fonts)document.fonts.ready.then(()=>{CK='';redraw()});
$('hv').textContent=Object.entries(VR).map(([k,v])=>k+' = '+v.join('|')).join(' · ')+' — الخلفيات: '+BG.join('|')+' — الحركات: '+AN.join('|')+' — الأدوار: '+RL.join('|')+' — الأيقونات: '+Object.keys(IC).join('|')+' — حتى 200 مشهد. cue = أول كلمات الجملة المنطوقة (مع SRT)، و start = ثانية بداية المشهد.';
fit();src.value=JSON.stringify(EX.title,null,1);run();
</script>
