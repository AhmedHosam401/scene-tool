<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#171a1f;--mut:#667085;--bd:#e3e6eb;--ac:#e8b13a;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.2rem;margin:0;font-weight:900}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;container-type:size;--a:#f5c04a;--b:#8a5a00;--tx:#fff6e0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}.seg{margin-inline-start:auto}
button,select,.file{font:inherit;font-weight:700;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button{white-space:nowrap}button.go{flex:1;background:var(--ac);border-color:var(--ac);color:#1a1405}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:42px;padding:0 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
button:focus-visible,textarea:focus-visible,select:focus-visible,.file:focus-within,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 16px}
.card[open]{padding-bottom:16px}
summary{cursor:pointer;font-weight:700;min-height:52px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';margin-inline-start:auto;color:var(--mut);font-size:1.3rem}
details[open]>summary::after{content:'\2212'}
textarea{width:100%;height:220px;direction:ltr;text-align:left;font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;resize:vertical}
#srt{height:100px;margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}#rst{min-height:36px;padding:0 12px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;font-weight:600;font-size:.9rem}
#msg{margin:0;padding:0 4px;list-style:none;font-size:.9rem;min-height:1.4em}
#msg li{color:var(--er)}#msg.ok li{color:var(--mut)}#msg details.wn{margin-top:2px}#msg details.wn summary{color:var(--er);font-weight:700;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}#msg details.wn ul{list-style:disc;margin:0;padding:0 20px 8px 0}#msg details.wn li{color:var(--er);margin-bottom:4px}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0}
.stage.vert{aspect-ratio:9/16;width:min(100%,calc(62vh*9/16));margin-inline:auto}
.themebar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:14px 16px;font-weight:700;min-width:0}.themebar label,.themebar .fld{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}.themebar label>span,.themebar .fld>span{font-size:.82rem;font-weight:600;opacity:.75}.themebar .seg{margin:0;width:100%}.themebar .seg button{flex:1;padding:0 8px}.themebar select{width:100%;min-width:0;max-width:100%;padding:0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;justify-content:flex-start}.themebar input{width:100%;min-width:0;min-height:44px;accent-color:var(--ac)}.themebar .wide{grid-column:1/-1}main>*{min-width:0;max-width:100%}
[hidden]{display:none!important}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.seek{display:flex;align-items:center;gap:10px;padding:0 4px}.seek input{flex:1;min-width:0;min-height:44px;accent-color:var(--ac)}.seek span{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--mut);min-width:92px;text-align:center}#segout{min-height:120px;margin-top:8px}#seg{min-height:36px;padding:0 12px;font-size:.85rem;margin-top:8px}</style>
</head>
<body>
<main>
<div class="top"><h1>معاين المشاهد</h1><button id="rst" aria-label="ريفريش" title="ريفريش">⟳</button></div>
<div class="stage" id="stage"><canvas id="cv"></canvas></div>
<div class="seek"><input type="range" id="sk" min="0" max="100" step="0.01" value="0" disabled aria-label="شريط التقدم"><span id="tm">0:00 / 0:00</span></div>
<div class="tools"><button class="go" id="play">▶ تشغيل</button><button id="stop">■ إيقاف</button><button id="exp">⬇ تصدير</button></div>
<div class="themebar card"><label><span>الثيم</span><select id="thm" aria-label="الثيم"><option value="">حسب الـ JSON</option><option value="dark-gold">ذهبي</option><option value="dark-purple">بنفسجي</option><option value="dark-teal">فيروزي</option><option value="dark-red">أحمر</option><option value="dark-blue">أزرق</option><option value="dark-green">أخضر</option><option value="dark-rose">وردي</option><option value="dark-orange">برتقالي</option><option value="dark-green-gold">أخضر وذهبي</option><option value="dark-navy-gold">كحلي وذهبي</option><option value="dark-black-gold">أسود وذهبي</option><option value="dark-indigo">نيلي</option><option value="dark-wine">عنّابي</option><option value="dark-lime">ليموني</option><option value="dark-sand">رملي</option><option value="mono">أبيض وأسود</option></select></label><label><span>قوة اللون</span><input type="range" id="tint" min="0" max="100" value="0" aria-label="قوة اللون"></label><label><span>الفريمات</span><select id="fps" aria-label="الفريمات"><option value="30">30 فريم</option><option value="60" selected>60 فريم</option></select></label><div class="fld"><span>المقاس</span><div class="seg" role="group" aria-label="المقاس"><button id="orH" aria-pressed="true">أفقي</button><button id="orV" aria-pressed="false">عمودي</button></div></div><label><span>أيقونات تلقائية</span><select id="ai" aria-label="أيقونات تلقائية"><option value="1">تشغيل</option><option value="0">إيقاف</option></select></label><label><span>توقيت الظهور</span><select id="lead" aria-label="توقيت الظهور"><option value="-0.6">تأخير 0.6 ث</option><option value="-0.4">تأخير 0.4 ث</option><option value="-0.2">تأخير 0.2 ث</option><option value="0">بدون</option><option value="0.2" selected>تقديم 0.2 ث</option><option value="0.4">تقديم 0.4 ث</option><option value="0.6">تقديم 0.6 ث</option></select></label><label><span>الانتقال بين المشاهد</span><select id="trn" aria-label="الانتقال"><option value="m" selected>متنوّع</option><option value="f">تلاشي</option><option value="s">انزلاق</option><option value="z">زوم</option><option value="0">بدون</option></select></label><label><span>حركة الكاميرا</span><select id="cam" aria-label="الكاميرا"><option value="0" selected>إيقاف</option><option value="1">ناعمة</option><option value="2">تقريب</option></select></label><label><span>إزاحة الكاميرا</span><select id="pan" aria-label="إزاحة الكاميرا"><option value="0">بدون</option><option value=".02">خفيفة</option><option value=".04" selected>متوسطة</option><option value=".07">قوية</option></select></label><label><span>التوهّج</span><select id="glw" aria-label="التوهج"><option value="0">إيقاف</option><option value="1" selected>خفيف</option><option value="2">قوي</option></select></label><label><span>توزيع الظهور على المشهد</span><select id="spr" aria-label="توزيع الظهور"><option value="0">إيقاف</option><option value=".5">50% من المشهد</option><option value=".8" selected>80% من المشهد</option></select></label><label><span>ظهور النص</span><select id="wrd" aria-label="ظهور النص"><option value="0">كامل</option><option value="1" selected>كلمة كلمة</option></select></label><label class="wide"><span>جودة التصدير</span><select id="qual" aria-label="جودة التصدير"><option value="2500000">خفيفة (حوالي 19 ميجا/دقيقة)</option><option value="4000000" selected>متوسطة (حوالي 30 ميجا/دقيقة)</option><option value="8000000">عالية (حوالي 60 ميجا/دقيقة)</option></select></label></div>
<ul id="msg" class="ok"><li>اختر مثالاً أو الصق JSON ثم اضغط تشغيل.</li></ul>
<details class="card" open><summary>المشاهد (JSON)</summary>
<textarea id="src" spellcheck="false" aria-label="JSON"></textarea>
<div class="row chips"><button id="clr">مسح</button><button data-ex="title">عنوان</button><button data-ex="bullets">نقاط</button><button data-ex="stat">رقم</button><button data-ex="quote">اقتباس</button><button data-ex="all">سكريبت كامل</button><button data-ex="allv">كل الأشكال</button><button id="exfx">جرافيك جديد</button></div>
<p class="hint">الأزرار بتعرض أمثلة، واضغط على نفس الزر تاني لشكل مختلف.</p></details>
<details class="card"><summary>الصوت والتوقيت</summary>
<div class="row"><label class="file"><span id="aln">🎙 إضافة صوت</span><input type="file" id="aud" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg"></label><button id="rma" hidden>إزالة الصوت</button></div>
<textarea id="srt" spellcheck="false" aria-label="SRT" placeholder="الصق محتوى SRT هنا أو ارفع الملف"></textarea>
<label class="file"><span>📄 رفع ملف SRT</span><input type="file" id="srtf" accept=".srt,.txt,text/plain"></label>
<button id="seg">📋 نسخ تقسيم الـ SRT</button><textarea id="segout" readonly hidden spellcheck="false" aria-label="المقاطع"></textarea></details>

<details class="card"><summary>القيم المسموحة</summary><p class="hint" id="hv"></p></details>
</main>

async function fixMp4(blob,fbSec){
const u8=new Uint8Array(await blob.arrayBuffer()),dv=new DataView(u8.buffer),L=u8.length;
const T=o=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
const kids=(s,e)=>{const a=[];while(s+8<=e){let z=dv.getUint32(s),h=8;if(z===1){z=Number(dv.getBigUint64(s+8));h=16}else if(z===0)z=e-s;if(z<h||s+z>e)break;a.push({t:T(s+4),s,e:s+z,b:s+h});s+=z}return a};
const find=(a,t)=>a.filter(k=>k.t===t);
const top=kids(0,L),moov=find(top,'moov')[0];if(!moov)return blob;
const mk=kids(moov.b,moov.e),mvhd=find(mk,'mvhd')[0];if(!mvhd)return blob;
const mv1=u8[mvhd.b]===1,mvTS=dv.getUint32(mvhd.b+(mv1?20:12));
const setD=(o,v1,sec_ts)=>{if(v1)dv.setBigUint64(o,BigInt(sec_ts));else dv.setUint32(o,Math.min(sec_ts,4294967295))};
const mvex=find(mk,'mvex')[0],trex={};
if(mvex)for(const x of find(kids(mvex.b,mvex.e),'trex'))trex[dv.getUint32(x.b+4)]=dv.getUint32(x.b+12);
const traks=find(mk,'trak').map(t=>{const c=kids(t.b,t.e),tk=find(c,'tkhd')[0],md=find(kids(find(c,'mdia')[0].b,find(c,'mdia')[0].e),'mdhd')[0];const tv1=u8[tk.b]===1,mv=u8[md.b]===1;return{tk,md,tv1,mv,id:dv.getUint32(tk.b+(tv1?20:12)),ts:dv.getUint32(md.b+(mv?20:12)),end:0}});
const byId={};traks.forEach(t=>byId[t.id]=t);
let absBase=false;
for(const mf of find(top,'moof'))for(const tf of find(kids(mf.b,mf.e),'traf')){
const c=kids(tf.b,tf.e),th=find(c,'tfhd')[0],td=find(c,'tfdt')[0];if(!th)continue;
const fl=dv.getUint32(th.b)&0xffffff,id=dv.getUint32(th.b+4);let o=th.b+8;
if(fl&1){absBase=true;o+=8}if(fl&2)o+=4;let dd=trex[id]||0;if(fl&8)dd=dv.getUint32(o);
let t=0;if(td)t=u8[td.b]===1?Number(dv.getBigUint64(td.b+4)):dv.getUint32(td.b+4);
for(const tr of find(c,'trun')){const f=dv.getUint32(tr.b)&0xffffff,n=dv.getUint32(tr.b+4);let p=tr.b+8;if(f&1)p+=4;if(f&4)p+=4;
const step=((f&0x100)?4:0)+((f&0x200)?4:0)+((f&0x400)?4:0)+((f&0x800)?4:0);
for(let i=0;i<n;i++){let d=dd;if(f&0x100)d=dv.getUint32(p);t+=d;p+=step}}
if(byId[id]&&t>byId[id].end)byId[id].end=t}
let sec=0;traks.forEach(t=>{if(t.ts&&t.end/t.ts>sec)sec=t.end/t.ts});if(!(sec>0))sec=fbSec;if(!(sec>0))return blob;
setD(mvhd.b+(mv1?24:16),mv1,Math.round(sec*mvTS));
for(const t of traks){setD(t.tk.b+(t.tv1?28:20),t.tv1,Math.round(sec*mvTS));setD(t.md.b+(t.mv?24:16),t.mv,Math.round((t.end/t.ts>0?t.end/t.ts:sec)*t.ts))}
if(!mvex)return new Blob([u8],{type:blob.type});
const mh=find(kids(mvex.b,mvex.e),'mehd')[0],fd=Math.round(sec*mvTS);
if(mh){setD(mh.b+4,u8[mh.b]===1,fd);return new Blob([u8],{type:blob.type})}
if(absBase||dv.getUint32(moov.s)<8||dv.getUint32(mvex.s)<8)return new Blob([u8],{type:blob.type});
const big=fd>4294967295,add=big?20:16,box=new Uint8Array(add),bv=new DataView(box.buffer);
bv.setUint32(0,add);box.set([109,101,104,100],4);bv.setUint32(8,big?0x01000000:0);if(big)bv.setBigUint64(12,BigInt(fd));else bv.setUint32(12,fd);
dv.setUint32(moov.s,dv.getUint32(moov.s)+add);dv.setUint32(mvex.s,dv.getUint32(mvex.s)+add);
return new Blob([u8.subarray(0,mvex.b),box,u8.subarray(mvex.b)],{type:blob.type})}
async function save(blob,name){let d=null;try{d=window.claude&&await claude.use('downloads')}catch(e){}
if(d){try{await d.save({filename:name,data:blob});msg.innerHTML='<li>تم حفظ '+name+'.</li>';return}catch(e){if(e&&e.code==='declined'){msg.innerHTML='<li>اتلغى الحفظ.</li>';return}}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();msg.innerHTML='<li>تم تجهيز '+name+' للتحميل.</li>'}

const type=(rec.mimeType||mt||'video/webm').split(';')[0];let out=new Blob(ch,{type});if(type.includes('mp4')){try{msg.className='ok';msg.innerHTML='<li>جارٍ تظبيط مدة الفيديو…</li>';out=await fixMp4(out,tl.total)}catch(e){}}
