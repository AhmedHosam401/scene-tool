<html lang="ar" dir="rtl">
<head>

<title>معاين مشاهد JSON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#171a1f;--mut:#667085;--bd:#e3e6eb;--ac:#e8b13a;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a20;--tx:#eef0f4;--mut:#9aa3b2;--bd:#272c35;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.2rem;margin:0;font-weight:900}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;container-type:size;--a:#f5c04a;--b:#8a5a00;--tx:#fff6e0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:8px;flex-wrap:wrap}.seg{margin-inline-start:auto}
button,select,.file{font:inherit;font-weight:700;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button{white-space:nowrap}button.go{flex:1;background:var(--ac);border-color:var(--ac);color:#1a1405}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:42px;padding:0 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--tx);color:var(--bg)}
button:focus-visible,textarea:focus-visible,select:focus-visible,.file:focus-within,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 16px}
.card[open]{padding-bottom:16px}
summary{cursor:pointer;font-weight:700;min-height:52px;display:flex;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';margin-inline-start:auto;color:var(--mut);font-size:1.3rem}
details[open]>summary::after{content:'\2212'}
textarea{width:100%;height:220px;direction:ltr;text-align:left;font:12.5px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;resize:vertical}
#srt{height:100px;margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}#rst{min-height:36px;padding:0 12px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;font-weight:600;font-size:.9rem}
#msg{margin:0;padding:0 4px;list-style:none;font-size:.9rem;min-height:1.4em}
#msg li{color:var(--er)}#msg.ok li{color:var(--mut)}
.hint{color:var(--mut);font-size:.85rem;margin:6px 0}
.stage.vert{aspect-ratio:9/16;width:min(100%,calc(62vh*9/16));margin-inline:auto}
.themebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:56px;padding:8px 16px;font-weight:700}.themebar label{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}.themebar select{flex:1;border:0;background:transparent;min-height:44px;padding:0}.themebar input{flex:1;min-width:0;accent-color:var(--ac)}
[hidden]{display:none!important}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style>
</head>

<main>
<div class="top"><h1>معاين المشاهد</h1><button id="rst" aria-label="ريفريش" title="ريفريش">⟳</button></div>

<ul id="msg" class="ok"><li>اختر مثالاً أو الصق JSON ثم اضغط تشغيل.</li></ul>
<details class="card" open><summary>المشاهد (JSON)</summary>
<textarea id="src" spellcheck="false" aria-label="JSON"></textarea>
<div class="row chips"><button id="clr">مسح</button><button data-ex="title">عنوان</button><button data-ex="bullets">نقاط</button><button data-ex="stat">رقم</button><button data-ex="quote">اقتباس</button><button data-ex="all">سكريبت كامل</button><button data-ex="allv">كل الأشكال</button></div>
<p class="hint">الأزرار بتعرض أمثلة، واضغط على نفس الزر تاني لشكل مختلف.</p></details>
<details class="card"><summary>الصوت والتوقيت</summary>
<div class="row"><label class="file"><span id="aln">🎙 إضافة صوت</span><input type="file" id="aud" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg"></label><button id="rma" hidden>إزالة الصوت</button></div>
<textarea id="srt" spellcheck="false" aria-label="SRT" placeholder="الصق محتوى SRT هنا أو ارفع الملف"></textarea>
<label class="file"><span>📄 رفع ملف SRT</span><input type="file" id="srtf" accept=".srt,.txt,text/plain"></label></details>

<details class="card"><summary>القيم المسموحة</summary><p class="hint" id="hv"></p></details>
</main>

async function fixMp4(blob,fbSec){
